name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-env
        with:
          python-version: '3.11'
      - name: Install dev extras
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Run ruff
        run: |
          source .venv/bin/activate
          ruff check src/amica

  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu tests against all versions
          - os: [ubuntu-latest]
            python-version: '3.10'
            resolution: 'lowest-direct'
            r_tests: false
          - os: [ubuntu-latest]
            python-version: '3.11'
            resolution: 'highest'
            r_tests: true
          - os: [ubuntu-latest]
            python-version: '3.12'
            resolution: 'highest'
            r_tests: true
          - os: [ubuntu-latest]
            python-version: '3.13'
            resolution: 'highest'
            r_tests: true
          - os: [ubuntu-latest]
            python-version: '3.14'
            resolution: 'highest'
            r_tests: true
          # On macOS & Windows just test against selected versions
          - os: [macos-latest]
            python-version: '3.12'
            resolution: 'highest'
            r_tests: true
          - os: [windows-latest]
            python-version: '3.12'
            resolution: 'highest'
            r_tests: false

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
      - uses: r-lib/actions/setup-r@v2
        if: matrix.r_tests
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R test dependencies
        if: matrix.r_tests
        run: |
          Rscript -e 'install.packages("daarem", repos = "https://cloud.r-project.org")'

      - name: Create uv virtual environment
        run: |
          uv venv
          # venv activation dir differs between Windows and *nix
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "ACTIVATE_DIR=Scripts" >> "$GITHUB_ENV"
          else
            echo "ACTIVATE_DIR=bin" >> "$GITHUB_ENV"
          fi
          echo "UV_RESOLUTION=${{ matrix.resolution }}" >> "$GITHUB_ENV"
          if [ "${{ matrix.r_tests }}" = "true" ]; then
            echo "PYTEST_MARKERS=not sklearn_api" >> "$GITHUB_ENV"
            echo "AMICA_EXTRAS=torch-cpu,r" >> "$GITHUB_ENV"
          else
            echo "PYTEST_MARKERS=not sklearn_api and not r_required" >> "$GITHUB_ENV"
            echo "AMICA_EXTRAS=torch-cpu" >> "$GITHUB_ENV"
          fi
      
      - name: Install Base Deps and check import
        run: |
          source .venv/${ACTIVATE_DIR}/activate
          uv pip install --resolution=${UV_RESOLUTION} -e ".[${AMICA_EXTRAS}]"
          python -c "import amica"

      - name: Check R bridge
        if: matrix.r_tests
        run: |
          source .venv/${ACTIVATE_DIR}/activate
          R --version
          python -c "import rpy2.robjects"

      - name: Install dev extras
        run: |
          source .venv/${ACTIVATE_DIR}/activate
          uv pip install -e ".[dev]"

      - name: Run tests
        run: |
          source .venv/${ACTIVATE_DIR}/activate
          pytest -m "${PYTEST_MARKERS}"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Minimize uv cache
        run: uv cache prune --ci
  
  sklearn-api-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}
      # TODO: can we stuff uv venv creation and activation into the setup-env action?
      - name: Create uv virtual environment
        run: |
          uv venv
          source .venv/bin/activate
      - name: Install dev extras
        run: |
          source .venv/bin/activate
          uv pip install -e ".[torch-cpu,dev]"
      - name: Run Scikit-Learn API tests
        run: |
          source .venv/bin/activate
          pytest -m "sklearn_api"
      - name: Minimize uv cache
        run: uv cache prune --ci
